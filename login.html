

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kantubyte | Iniciar sesión</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <!-- LOGO -->
            <header class="login-header">

                <img src="imagenes/logo-kantubyte-transparente.jpg"
                     alt="Logo oficial de Kantubyte"
                     class="login-logo">

                <h1>KANTUBYTE</h1>

                <p>Tecnología que conecta posibilidades.</p>

            </header>


            <!-- FORMULARIO -->
            <div class="login-content">

                <h2>Iniciar sesión</h2>

                <p>Ingresa tus datos para acceder a nuestra tienda.</p>

                <form id="loginForm">

                    <!-- NOMBRE DE USUARIO -->
                    <div class="input-group">

                        <label for="username">
                            Nombre de usuario
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Ingresa tu usuario"
                            required
                        >

                    </div>


                    <!-- CORREO -->
                    <div class="input-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required
                        >

                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="input-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="password-container">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Ingresa tu contraseña"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                aria-label="Mostrar contraseña"
                            >
                                Mostrar
                            </button>

                        </div>

                        <small class="password-info">
                            Tu contraseña debe tener entre 6 y 8
                            caracteres y al menos 2 números.
                        </small>

                    </div>


                    <!-- RECORDAR -->
                    <div class="login-options">

                        <label>
                            <input
                                type="checkbox"
                                id="remember"
                            >
                            Recordar mis datos
                        </label>

                    </div>


                    <!-- BOTÓN -->
                    <button
                        type="submit"
                        id="loginButton"
                    >
                        Iniciar sesión
                    </button>

                </form>


                <!-- INFORMACIÓN -->
                <div class="login-footer">

                    <p>
                        Bienvenido al universo tecnológico
                        de Kantubyte.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>
</html>
